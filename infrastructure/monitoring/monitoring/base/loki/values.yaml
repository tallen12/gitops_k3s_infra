deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem # override to s3/gcs/azure in prod

  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 168h # 7 days; requires compactor.retention_enabled
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_query_parallelism: 32

  compactor:
    retention_enabled: true
    delete_request_store: filesystem  # match your storage type

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    size: 15Gi
    storageClass: "observability-longhorn-storage-class" # override in overlay

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Gateway: single stable ClusterIP that Grafana and Alloy point at.
gateway:
  enabled: false

# Loki Canary sends synthetic log lines to verify the pipeline end-to-end.
lokiCanary:
  enabled: true

# Disable the built-in self-monitoring/monitoring section — kube-prometheus-stack
# already scrapes everything via its own ServiceMonitors.
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false # canary deployed via lokiCanary above, not monitoring subchart

test:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
