apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

helmCharts:
  - name: loki
    # grafana-community/helm-charts is the new home for the OSS Loki chart
    # as of March 16 2026 (forked from grafana/loki at chart v6.55.0).
    repo: https://grafana.github.io/helm-charts
    version: "6.55.0"
    releaseName: loki
    namespace: monitoring
    valuesFile: values.yaml
