# values for kube-prometheus-stack
# Chart: prometheus-community/kube-prometheus-stack
# Chart version: ~85.x  (app: Prometheus v3.x, Grafana 11.x)
#
# Key decisions:
#   - Grafana datasources include Loki (auto-wired to the loki service)
#   - Persistent storage enabled; override storageClassName in overlays
#   - Alertmanager enabled but with a minimal config — override in prod

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: browser

  # Wire Loki in as a datasource so it's available immediately after install.
  # The URL points to the Loki gateway service deployed by the loki chart
  # in the same namespace.
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: "observability-longhorn-storage-class" # override in overlay if needed

  # Sidecar watches for ConfigMaps/Secrets labelled grafana_datasource/dashboard
  sidecar:
    datasources:
      enabled: true
      searchNamespace: monitoring
    dashboards:
      enabled: true
      searchNamespace: monitoring

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d # down from 15d
    retentionSize: "18GB"

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: observability-longhorn-storage-class
          resources:
            requests:
              storage: 20Gi
    # Allow the operator to pick up ServiceMonitors from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: observability-longhorn-storage-class
          resources:
            requests:
              storage: 5Gi

kubeControllerManager:
  # Add all k3s Control-Plane IPs
  endpoints:
    - k3s-node-tomori
  service:
    port: 10257
    targetPort: 10257
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeScheduler:
  # Add all k3s Control-Plane IPs
  endpoints:
    - k3s-node-tomori
  service:
    port: 10259
    targetPort: 10259
  serviceMonitor:
    https: true
    insecureSkipVerify: true
kubeEtcd:
  # Add all k3s Control-Plane IPs
  endpoints:
    - k3s-node-tomori
  service:
    port: 2381
    targetPort: 2381
kubeProxy:
  service:
    port: 10249
    targetPort: 10249
    selector:
      k8s-app: pushprox-kube-proxy-client
  serviceMonitor:
    proxyUrl: http://pushprox-kube-proxy-proxy.kube-system.svc:8080
    https: false
    relabelings:
      - action: replace
        sourceLabels:
          - __meta_kubernetes_pod_ip
        targetLabel: pod_ip
      - action: replace
        sourceLabels:
          - __meta_kubernetes_pod_node_name
        targetLabel: instance

prometheus-node-exporter:
  hostNetwork: false
  hostPID: false
  prometheus:
    monitor:
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_ip
          targetLabel: pod_ip
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: instance
