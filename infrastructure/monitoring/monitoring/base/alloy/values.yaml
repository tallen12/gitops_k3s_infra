# values for grafana/alloy
# Alloy replaces Promtail (EOL March 2026) as the log collection agent.
#
# Deployed as a DaemonSet so every node's pod logs are collected.
# Uses loki.source.kubernetes (K8s API-based) rather than file tailing.
#
# Pipeline:
#   discovery.kubernetes  →  relabel  →  loki.source.kubernetes  →  loki.write

alloy:
  # The Alloy config is inlined here and mounted as a ConfigMap.
  # Use the River (Alloy) config language.
  configMap:
    create: true
    content: |
      // -------------------------------------------------------
      // 1. Discover all pods in the cluster
      // -------------------------------------------------------
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // -------------------------------------------------------
      // 2. Relabel: keep only running containers, add useful labels
      // -------------------------------------------------------
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Drop pods that have opted out of log collection
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_logging_exclude"]
          regex         = "true"
          action        = "drop"
        }

        // Expose pod metadata as Loki stream labels
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      // -------------------------------------------------------
      // 3. Collect logs via the Kubernetes API (no file tailing)
      // -------------------------------------------------------
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.gateway.receiver]
      }

      // -------------------------------------------------------
      // 4. Ship to the Loki gateway
      // -------------------------------------------------------
      loki.write "gateway" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
      // Add metric collection for control plane nodes due to k3s metrics not being exposed as part of the binary.
      // -------------------------------------------------------
      // 5. Discover control plane nodes
      // -------------------------------------------------------
      discovery.kubernetes "control_plane_nodes" {
        role = "node"
      }
      discovery.relabel "control_plane" {
        targets = discovery.kubernetes.control_plane_nodes.targets
        // Only scrape on control plane nodes
        rule {
          source_labels = ["__meta_kubernetes_node_label_node_role_kubernetes_io_control_plane"]
          regex         = "true"
          action        = "keep"
        }
        // Use the node's internal IP
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__host__"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }
      // -------------------------------------------------------
      // 6. Scrape kube-controller-manager (only on control plane pods)
      // -------------------------------------------------------
      prometheus.scrape "kube_controller_manager" {
        targets = [for t in discovery.relabel.control_plane.output : merge(t, {
          "__address__" = t.__host__ + ":10257",
          "job"         = "kube-controller-manager",
        })]
        scheme           = "https"
        scrape_interval  = "30s"
        tls_config {
          insecure_skip_verify = true
        }
        forward_to = [prometheus.remote_write.prometheus.receiver]
      }
      // -------------------------------------------------------
      // 7. Scrape kube-scheduler (only on control plane pods)
      // -------------------------------------------------------
      prometheus.scrape "kube_scheduler" {
        targets = [for t in discovery.relabel.control_plane.output : merge(t, {
          "__address__" = t.__host__ + ":10259",
          "job"         = "kube-scheduler",
        })]
        scheme           = "https"
        scrape_interval  = "30s"
        tls_config {
          insecure_skip_verify = true
        }
        forward_to = [prometheus.remote_write.prometheus.receiver]
      }
      // -------------------------------------------------------
      // 8. Remote write metrics to Prometheus
      // -------------------------------------------------------
      prometheus.remote_write "prometheus" {
        endpoint {
          url = "http://prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/write"
        }
      }
controller:
  # Run as a DaemonSet so every node is covered
  type: daemonset

  tolerations:
    # Allow Alloy to run on control-plane nodes too
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

serviceAccount:
  create: true
  name: alloy

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
