---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-secret
  namespace: lldap
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-k3s
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LLDAP_JWT_SECRET
      remoteRef:
        key: "LLDAP"
        property: jwt_secret
    - secretKey: LLDAP_KEY_SEED
      remoteRef:
        key: "LLDAP"
        property: key_seed
    - secretKey: LLDAP_LDAP_USER_PASS
      remoteRef:
        key: "LLDAP"
        property: admin_password 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lldap-config
  namespace: lldap
data:
  TZ: "UTC"
  LLDAP_LDAP_BASE_DN: "dc=auth,dc=tylera,dc=dev"   # change to your domain
  LLDAP_LDAP_USER_DN: "admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: lldap
  labels:
    app: lldap
spec:
  replicas: 1  # increase to 2+ only if using external postgres (not sqlite)
  template:
    metadata:
      labels:
        app: lldap
    spec:
      containers:
        - name: lldap
          image: lldap/lldap:stable
          ports:
            - name: ldap
              containerPort: 3890
              protocol: TCP
            - name: web
              containerPort: 17170
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lldap-config
          env:
            - name: LLDAP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lldap-secret
                  key: LLDAP_JWT_SECRET
            - name: LLDAP_KEY_SEED
              valueFrom:
                secretKeyRef:
                  name: lldap-secret
                  key: LLDAP_KEY_SEED
            - name: LLDAP_LDAP_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: lldap-secret
                  key: LLDAP_LDAP_USER_PASS
            # Pull the postgres connection URI from the CNPG-generated secret
            - name: LLDAP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lldap-postgres-app  # CNPG creates this automatically
                  key: uri
          livenessProbe:
            httpGet:
              path: /health
              port: web
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
 
---
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: lldap
spec:
  selector:
    app: lldap
  ports:
    - name: ldap
      port: 389
      targetPort: ldap
    - name: web
      port: 80
      targetPort: web
---
