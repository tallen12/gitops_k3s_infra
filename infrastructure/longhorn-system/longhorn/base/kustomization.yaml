apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: longhorn-system
resources:
  - https://raw.githubusercontent.com/longhorn/longhorn/v1.11.2/deploy/longhorn.yaml
  - storage-class.yaml

patches:
  - path: patches/default-setting-patch.yaml
  - target:
      kind: Namespace
      name: longhorn-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: longhorn-system
        labels:
          istio.io/dataplane-mode: ambient