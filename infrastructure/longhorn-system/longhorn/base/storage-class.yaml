apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-storage-class
  namespace: longhorn-system
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: postgres-longhorn-storage-class
  namespace: longhorn-system
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "1"
  dataLocality: "local-strict"
